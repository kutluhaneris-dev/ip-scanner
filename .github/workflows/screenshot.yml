name: Ekran görüntüsü

# Arayüzü Windows'ta açıp tarama yaptırır ve ekran görüntüsünü saklar (görsel kontrol için).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/IPScanner/UI/**', 'src/IPScanner/Resources/**']

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derle
        run: dotnet build src/IPScanner/IPScanner.csproj -c Release -o out
      - name: Aç, tara, ekran görüntüsü al
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath "out\IPScanner.exe" -PassThru
          Start-Sleep -Seconds 6
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id)
          Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait("{F5}")
          Start-Sleep -Seconds 25
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
